<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" role="img" aria-label="Instagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Instagram</title>
<style>
text{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}
.sweep{stroke-dasharray:16 84;animation:run 3.2s linear 0.8s infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.dot{animation:p 2s ease-in-out 0.8s infinite}
@keyframes p{50%{opacity:.25}}
.arrow{animation:nudge 2.4s ease-in-out 0.8s infinite}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
</style>
<rect x=".75" y=".75" width="248.5" height="54.5" rx="13" fill="#0D1117" stroke="#A78BFA" stroke-opacity=".4" stroke-width="1.5"/>
<rect class="sweep" x=".75" y=".75" width="248.5" height="54.5" rx="13" fill="none" stroke="#A78BFA" stroke-width="2.2" pathLength="100"/>
<rect x="19" y="15" width="26" height="26" rx="8" fill="none" stroke="#A78BFA" stroke-width="2.2"/><circle cx="32" cy="28" r="6.2" fill="none" stroke="#A78BFA" stroke-width="2.2"/><circle cx="39.5" cy="21" r="1.7" fill="#A78BFA"/>
<text x="62" y="26" font-size="15" font-weight="700" fill="#F8FAFC">Instagram</text>
<text x="62" y="43" font-size="11" fill="#64748B">follow along</text>
<circle class="dot" cx="192" cy="28" r="3" fill="#A78BFA"/>
<text class="arrow" x="216" y="34" font-size="18" fill="#A78BFA">↗</text>
</svg>
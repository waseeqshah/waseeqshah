<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" role="img" aria-label="Email" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Email</title>
<style>
text{font-family:'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace}
.sweep{stroke-dasharray:16 84;animation:run 3.2s linear 1.6s infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.dot{animation:p 2s ease-in-out 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.arrow{animation:nudge 2.4s ease-in-out 1.6s infinite}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
</style>
<rect x=".75" y=".75" width="248.5" height="54.5" rx="13" fill="#0D1117" stroke="#10B981" stroke-opacity=".4" stroke-width="1.5"/>
<rect class="sweep" x=".75" y=".75" width="248.5" height="54.5" rx="13" fill="none" stroke="#10B981" stroke-width="2.2" pathLength="100"/>
<rect x="18" y="18" width="28" height="20" rx="4" fill="none" stroke="#10B981" stroke-width="2.2"/><path d="M20 22 L32 31 L44 22" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="26" font-size="15" font-weight="700" fill="#F8FAFC">Email</text>
<text x="62" y="43" font-size="11" fill="#64748B">say hello</text>
<circle class="dot" cx="192" cy="28" r="3" fill="#10B981"/>
<text class="arrow" x="216" y="34" font-size="18" fill="#10B981">↗</text>
</svg>